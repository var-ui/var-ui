[build]
command = "pnpm docs:build"
publish = "docs/dist"
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs packages package.json pnpm-lock.yaml pnpm-workspace.yaml .nvmrc"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "10.11.1"

[dev]
command = "pnpm docs:dev"
targetPort = 4321
framework = "#custom"
