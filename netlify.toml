# Production deploys and PR previews run via .github/workflows/ci.yml (Netlify CLI).
# Skip Netlify Git-triggered builds to avoid duplicate deploys.
# CI deploys with: netlify deploy --filter @var-ui/docs --dir=dist --functions=.netlify/v1/functions --no-build
[build]
base = "docs"
publish = "dist"
ignore = "exit 0"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "10.11.1"
ASTRO_TELEMETRY_DISABLED = "1"

[dev]
command = "pnpm docs:dev"
targetPort = 4321
framework = "#custom"
