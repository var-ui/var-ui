# Production deploys and PR previews run via .github/workflows/ci.yml (Netlify CLI).
# Skip Netlify Git-triggered builds to avoid duplicate deploys.
# CI: netlify deploy --filter @var-ui/docs-site --dir=docs/dist --functions=.netlify/v1/functions --no-build
# (--filter scopes functions to the package; do not prefix paths with docs/)
#
# Do not set `base = "docs"` — @astrojs/netlify resolves this relative to the docs
# package cwd during `astro dev`, producing a non-existent `docs/docs` path.
[build]
publish = "docs/dist"
ignore = "exit 0"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "10.11.1"
ASTRO_TELEMETRY_DISABLED = "1"

[dev]
command = "pnpm docs:dev"
targetPort = 4321
framework = "#custom"
