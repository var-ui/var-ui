[build]
command = "pnpm run build"
publish = "dist"
# Ignore command runs from the repository root (monorepo base directory).
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs packages package.json pnpm-lock.yaml pnpm-workspace.yaml .nvmrc"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "10.11.1"

[dev]
command = "pnpm run dev"
targetPort = 4321
framework = "#custom"
