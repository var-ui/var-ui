name: Unpublish 1.x and 2.x

# One-shot companion to the 0.x version reset. Waits for 0.1.0, then removes
# accidental 1.x/2.x publishes. Safe to re-run (missing versions are skipped).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/unpublish-1x-2x.mjs'
      - '.github/workflows/unpublish-1x-2x.yml'

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - run: node scripts/unpublish-1x-2x.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
